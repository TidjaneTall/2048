<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2048</title>
  <link href="style/main.css" rel="stylesheet">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f2ef">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1>2048</h1>
      <div class="stats">
        <div class="stat score-container" aria-live="polite" aria-atomic="true">
          <span class="stat-label">Score</span>
          <span class="stat-value score-value">0</span>
        </div>
        <div class="stat best-container" aria-live="polite" aria-atomic="true">
          <span class="stat-label">Best</span>
          <span class="stat-value score-value">0</span>
        </div>
      </div>
    </header>

    <div class="stage">
      <div
        class="board game-container"
        tabindex="0"
        role="group"
        aria-label="Board. Drag, swipe, or use arrow keys."
      >
        <div class="grid grid-container" aria-hidden="true">
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        <div class="tiles tile-container"></div>
        <div class="overlay game-message" role="status" aria-live="assertive" aria-atomic="true">
          <p></p>
          <div class="overlay-actions">
            <button type="button" class="keep-playing-button">Keep going</button>
            <button type="button" class="retry-button">Try again</button>
          </div>
        </div>
      </div>

      <div class="sheet" id="info-panel" hidden role="dialog" aria-labelledby="info-title">
        <h2 id="info-title">Source</h2>
        <p>
          Original 2048 is
          <a href="https://github.com/gabrielecirulli/2048" target="_blank" rel="noopener">MIT, 2014</a>.
        </p>
      </div>
      <div class="sheet" id="settings-panel" hidden role="dialog" aria-labelledby="settings-title">
        <h2 id="settings-title">How to play</h2>
        <p>Swipe, drag, or use the arrow keys. Matching tiles merge when they touch. Reach 2048.</p>
      </div>
    </div>

    <footer class="dock">
      <div class="dock-row">
        <p class="hint">Drag, swipe, or arrow keys.</p>
        <div class="tools">
          <button
            type="button"
            class="icon-button info-button"
            aria-label="Info"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="info-panel"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 11v5M12 8h.01"/>
            </svg>
          </button>
          <button
            type="button"
            class="icon-button settings-button"
            aria-label="Settings"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="settings-panel"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h10M18 8h2M4 16h2M10 16h10"/>
              <circle cx="16" cy="8" r="2"/>
              <circle cx="8" cy="16" r="2"/>
            </svg>
          </button>
          <button type="button" class="icon-button restart-button" aria-label="New Game">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </div>
    </footer>
  </main>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/kernel.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
