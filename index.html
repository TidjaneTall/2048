<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2048</title>
  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f3f1ee">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div class="container">
    <header class="heading">
      <h1 class="title">2048</h1>
      <div class="heading-actions">
        <div class="scores-container">
          <div class="score-container" aria-live="polite" aria-atomic="true">
            <span class="score-label">Score</span>
            <span class="score-value">0</span>
          </div>
          <div class="best-container" aria-live="polite" aria-atomic="true">
            <span class="score-label">Best</span>
            <span class="score-value">0</span>
          </div>
        </div>
        <button type="button" class="restart-button">New Game</button>
      </div>
    </header>

    <p class="game-intro">Join the numbers. Get to <strong>2048</strong>.</p>

    <div class="game-container">
      <div class="game-message" role="status" aria-live="assertive" aria-atomic="true">
        <p></p>
        <div class="lower">
          <button type="button" class="keep-playing-button">Keep going</button>
          <button type="button" class="retry-button">Try again</button>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
        <div class="grid-row">
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
          <div class="grid-cell"></div>
        </div>
      </div>

      <div class="tile-container" role="group" aria-label="Board"></div>
    </div>

    <p class="game-explanation">Arrow keys or swipe. Matching tiles merge.</p>
    <p class="credit">
      Original source: <a href="https://github.com/gabrielecirulli/2048" target="_blank" rel="noopener">2048 (MIT, 2014)</a>.
    </p>
  </div>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/kernel.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
